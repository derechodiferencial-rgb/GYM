<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rutina Panchita - UCN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #FFF9F9; 
            margin: 0; 
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .rounded-card { border-radius: 2.5rem; }
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .soft-shadow { box-shadow: 0 10px 30px -5px rgba(155, 27, 48, 0.12); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const Icons = {
            Home: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Calendar: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            ArrowLeft: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
            Sun: () => <svg width="40" height="40" viewBox="0 0 24 24" fill="#facc15" stroke="#eab308" strokeWidth="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>,
            Chevron: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        };

        const App = () => {
            const [tab, setTab] = useState('inicio');
            const [selectedDay, setSelectedDay] = useState(null);

            const schedule = [
                { id: 'lunes', name: 'LUNES', title: 'Descanso Activo', sub: 'DÍA PESADO UCN', icon: "📚", content: 'Día largo de Educación Diferencial en Guayacán. Prioriza el descanso mental. ¡Paseo relax con Khoda al llegar!' },
                { id: 'martes', name: 'MARTES', title: 'Glúteo Burbuja', sub: 'TARDE LIBRE', icon: "🍑" },
                { id: 'miercoles', name: 'MIERCOLES', title: 'Torso & Postura', sub: 'CARGA MEDIA', icon: "🦢" },
                { id: 'jueves', name: 'JUEVES', title: 'Descanso Activo', sub: 'FULL ESTUDIO', icon: "📓", content: 'Muchas horas de estudio hoy. No te preocupes por el gym. ¡Misión Junior y a dormir temprano!' },
                { id: 'viernes', name: 'VIERNES', title: 'Quema-Azúcar', sub: 'TARDE LIBRE', icon: "⚡" },
                { id: 'sabado', name: 'SABADO', title: 'Detalle & Cadera', sub: 'FIN DE SEMANA', icon: "💄" },
                { id: 'domingo', name: 'DOMINGO', title: 'Paseo & Junior', sub: '', icon: "🐾" }
            ];

            const exercises = {
                martes: {
                    title: 'GLÚTEO BURBUJA',
                    items: [
                        { n: 'Hip Thrust', s: '4 x 15-20', t: 'Máquina específica. Empuja con talones y aguanta 2 seg arriba.' },
                        { n: 'Prensa 45°', s: '3 x 15-20', t: 'Pies altos y anchos. Rodillas siempre hacia afuera.' },
                        { n: 'Extensión de Cuádriceps', s: '3 x 15', t: 'CAMBIO SEGURIDAD. Sentada para no perder el equilibrio.' },
                        { n: 'Curl Femoral', s: '3 x 20', t: 'Sentada. Mantén la cola pegada al asiento.' }
                    ],
                    cardio: { v: '4.8 - 5.0', i: '10' }
                },
                miercoles: {
                    title: 'TORSO & POSTURA',
                    items: [
                        { n: 'Jalón al Pecho', s: '3 x 15-20', t: 'Agarre amplio para cintura fina. Al pecho alto.' },
                        { n: 'Remo en Máquina', s: '3 x 15-20', t: 'Postura post-estudio Diferencial.' },
                        { n: 'Press Hombro', s: '3 x 15', t: 'Máquina sentada. Protege tus articulaciones.' },
                        { n: 'Vuelos Laterales', s: '3 x 20', t: 'Polea baja para tensión constante.' }
                    ],
                    cardio: { v: '5.0', i: '3' }
                },
                viernes: {
                    title: 'QUEMA-AZÚCAR',
                    items: [
                        { n: 'Prensa 45°', s: '20 reps', t: 'Pies altos. Ritmo fluido.' },
                        { n: 'Remo Máquina', s: '20 reps', t: 'Controla el regreso del peso.' },
                        { n: 'Press Pecho', s: '20 reps', t: 'Tonificación suave de brazos.' }
                    ],
                    cardio: { v: '5.0', i: '4' }
                },
                sabado: {
                    title: 'DETALLE & CADERA',
                    items: [
                        { n: 'Abductores', s: '4 x 25', t: 'Inclínate adelante para hip dips y forma reloj de arena.' },
                        { n: 'Patada de Glúteo', s: '4 x 15-20/lado', t: 'APOYO 90°. Enfoque 100% en el glúteo sin perder equilibrio.' },
                        { n: 'Prensa Unilateral', s: '3 x 15/lado', t: 'Una sola pierna. Corrige desbalances.' }
                    ],
                    cardio: { v: '5.3', i: '5' }
                }
            };

            const HomeView = () => (
                <div className="p-6 space-y-6 animate-in">
                    <div className="flex justify-between items-center mt-4">
                        <div>
                            <h1 className="text-4xl font-black italic tracking-tighter text-[#9B1B30]">Hola, Panchita!</h1>
                            <p className="text-[10px] font-bold tracking-[0.2em] text-gray-400 uppercase">Educación Diferencial UCN 🐾</p>
                        </div>
                        <div className="w-16 h-16 rounded-full flex items-center justify-center border-2 border-[#9B1B30] bg-white soft-shadow">
                            <Icons.Sun />
                        </div>
                    </div>

                    <div className="bg-white rounded-card p-6 soft-shadow flex items-center gap-5 border border-red-50">
                        <div className="bg-[#9B1B30] p-4 rounded-2xl text-white text-2xl">🐾</div>
                        <div>
                            <h3 className="font-black text-xs tracking-widest text-[#9B1B30] uppercase">Misión Junior</h3>
                            <p className="text-[11px] text-gray-500 font-semibold leading-tight">Paseo de 15 min con Khoda post-comida.</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                        <button onClick={() => setTab('rutina')} className="bg-[#9B1B30] rounded-card py-10 text-white soft-shadow active:scale-95 transition-transform">
                            <span className="text-4xl block mb-2">🏋️‍♀️</span>
                            <span className="font-black text-[10px] uppercase tracking-widest">Mi Rutina</span>
                        </button>
                        <div className="bg-white rounded-card py-10 soft-shadow opacity-60">
                            <span className="text-4xl block mb-2">⚙️</span>
                            <span className="font-black text-[10px] uppercase text-[#9B1B30] tracking-widest">Variantes</span>
                        </div>
                    </div>

                    <div className="bg-[#9B1B30] rounded-[2rem] p-7 text-white soft-shadow">
                        <h3 className="font-black text-[10px] uppercase tracking-widest mb-2 opacity-80 text-center">Seguridad Técnica</h3>
                        <p className="text-[11px] italic font-medium text-center">"Técnica sobre peso siempre. Rodilla hacia afuera, pies firmes."</p>
                    </div>
                </div>
            );

            const CalendarView = () => (
                <div className="p-6 space-y-4 animate-in">
                    <button onClick={() => setTab('inicio')} className="p-3 bg-white rounded-full text-[#9B1B30] soft-shadow mb-4"><Icons.ArrowLeft /></button>
                    <h2 className="text-2xl font-black italic text-[#9B1B30] mb-6">Tu Horario UCN</h2>
                    {schedule.map(d => (
                        <button key={d.id} onClick={() => d.id !== 'lunes' && d.id !== 'jueves' && d.id !== 'domingo' && setSelectedDay(d.id)} className="w-full bg-white rounded-[2rem] p-5 flex items-center justify-between soft-shadow border border-red-50 active:scale-95 transition-transform">
                            <div className="flex items-center gap-4">
                                <div className="bg-red-50 p-4 rounded-2xl min-w-[64px] flex items-center justify-center text-2xl">{d.icon}</div>
                                <div className="text-left">
                                    <p className="text-[10px] font-black text-[#FF0055] uppercase">{d.name}</p>
                                    <h3 className="font-black text-lg text-[#9B1B30] leading-none mt-1">{d.title}</h3>
                                </div>
                            </div>
                            <span className="text-red-200"><Icons.Chevron /></span>
                        </button>
                    ))}
                </div>
            );

            const DetailView = () => {
                const data = exercises[selectedDay];
                if (!data) return (
                    <div className="p-6 text-center animate-in">
                        <button onClick={() => setSelectedDay(null)} className="p-3 bg-white rounded-full text-[#9B1B30] soft-shadow mb-8"><Icons.ArrowLeft /></button>
                        <h1 className="text-4xl font-black text-[#9B1B30] mb-8 italic">Descanso</h1>
                        <div className="bg-white p-10 rounded-card soft-shadow border border-red-50">
                            <span className="text-6xl block mb-6">😴</span>
                            <p className="font-bold text-gray-600 leading-relaxed">{schedule.find(s=>s.id===selectedDay).content}</p>
                        </div>
                    </div>
                );
                return (
                    <div className="p-4 space-y-6 animate-in pb-32">
                        <button onClick={() => setSelectedDay(null)} className="p-3 bg-white rounded-full text-[#9B1B30] soft-shadow mb-4"><Icons.ArrowLeft /></button>
                        <h1 className="text-4xl font-black text-[#9B1B30] text-center italic mb-8">{data.title}</h1>
                        {data.items.map((ex, i) => (
                            <div key={i} className="bg-white p-6 rounded-card soft-shadow space-y-3 border border-red-50">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-black text-xl text-[#9B1B30]">{ex.n}</h3>
                                    <span className="bg-[#9B1B30] px-3 py-1 rounded-xl text-white text-[10px] font-black italic">{ex.s}</span>
                                </div>
                                <p className="text-[11px] font-bold text-gray-500 leading-relaxed">{ex.t}</p>
                            </div>
                        ))}
                        <div className="bg-[#9B1B30] p-10 rounded-[3rem] text-white text-center shadow-xl">
                            <h3 className="font-black italic mb-6 tracking-widest uppercase">Cardio Caminadora</h3>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-white/10 p-4 rounded-2xl">
                                    <p className="text-[9px] opacity-60 mb-1 uppercase font-black">Velocidad</p>
                                    <p className="text-2xl font-black">{data.cardio.v}</p>
                                </div>
                                <div className="bg-white/10 p-4 rounded-2xl">
                                    <p className="text-[9px] opacity-60 mb-1 uppercase font-black">Inclinación</p>
                                    <p className="text-2xl font-black">{data.cardio.i}%</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="max-w-md mx-auto min-h-screen">
                    {selectedDay ? <DetailView /> : (tab === 'inicio' ? <HomeView /> : <CalendarView />)}
                    {!selectedDay && (
                        <div className="fixed bottom-8 left-1/2 -translate-x-1/2 w-[92%] bg-white/90 backdrop-blur-lg rounded-full soft-shadow flex justify-around p-3 z-50 border border-red-50">
                            <button onClick={() => setTab('inicio')} className={`p-4 rounded-full transition-all ${tab==='inicio'?'bg-[#9B1B30] text-white shadow-lg':'text-gray-300'}`}><Icons.Home /></button>
                            <button onClick={() => setTab('rutina')} className={`p-4 rounded-full transition-all ${tab==='rutina'?'bg-[#9B1B30] text-white shadow-lg':'text-gray-300'}`}><Icons.Calendar /></button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
