<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Panchita Fit">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3501/3501193.png">
    
    <title>Pizarra Fitness Panchita</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #FFF9F9; 
            margin: 0; padding: 0;
            user-select: none;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        
        .rounded-card { border-radius: 2.5rem; }
        .soft-shadow { box-shadow: 0 12px 35px -8px rgba(155, 27, 48, 0.15); }
        
        .animate-in { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [view, setView] = useState('inicio');
            const [day, setDay] = useState(null);

            const colors = { lipstick: '#9B1B30', accent: '#FF0055' };

            const schedule = [
                { id: 'lun', n: 'LUNES', t: 'Descanso Activo', s: 'DÍA PESADO UCN', i: '📚', text: 'Día largo de Educación Diferencial (17:35). Prioriza el descanso mental. ¡Paseo relax con Junior al llegar a Guayacán!' },
                { id: 'mar', n: 'MARTES', t: 'Glúteo Burbuja', s: 'TARDE LIBRE POST-PRÁCTICA', i: '🍑' },
                { id: 'mie', n: 'MIE', t: 'Torso & Postura', s: 'CARGA MEDIA UCN', i: '🦢' },
                { id: 'jue', n: 'JUEVES', t: 'Descanso Activo', s: 'DÍA FULL CLASES', i: '📓', text: 'Muchas horas de estudio hoy en la UCN. No te preocupes por el gym. ¡Misión Junior y a dormir temprano!' },
                { id: 'vie', n: 'VIERNES', t: 'Circuito Quema-Azúcar', s: 'TARDE LIBRE', i: '⚡' },
                { id: 'sab', n: 'SABADO', t: 'Detalle & Cadera', s: 'FIN DE SEMANA', i: '💄' },
                { id: 'dom', n: 'DOMINGO', t: 'Paseo & Junior', s: '', i: '🐾' }
            ];

            const routines = {
                mar: {
                    title: 'GLÚTEO BURBUJA',
                    tagline: 'PROYECCIÓN (MÁQUINAS)',
                    items: [
                        { n: 'Hip Thrust', s: '4 x 15-20', d: 'EN MÁQUINA ESPECÍFICA. La máquina estabiliza tu cadera. Ideal para tus pies que tienden a meterse.', tip: 'Empuja con talones y aguanta 2s arriba apretando fuerte.', rest: '90s' },
                        { n: 'Prensa 45°', s: '3 x 15-20', d: 'PIES ALTOS Y ANCHOS en la placa. Esta variante hace crecer el glúteo sin ensanchar los muslos por delante.', tip: 'Rodillas siempre hacia afuera, siguiendo la línea del segundo dedo del pie.', rest: '60s' },
                        { n: 'Extensión de Cuádriceps', s: '3 x 15', d: 'REEMPLAZO POR SEGURIDAD. Al estar sentada, eliminas el riesgo de perder el equilibrio de los rieles. ¡Fuerza pura!', tip: 'Extiende lento y controla la bajada sin tirones.', rest: '60s' },
                        { n: 'Curl Femoral', s: '3 x 20', d: 'SENTADA EN MÁQUINA. Variante más segura para tu espalda baja y estira mejor el músculo.', tip: 'No levantes la cola del asiento al bajar el peso.', rest: '60s' }
                    ],
                    cardio: { v: '4.8 - 5.0', i: '10', t: '20 min', text: '"Panchita, pisa como si estuvieras en una pasarela: pies rectos y firmes. ¡Tú mandas!"' }
                },
                mie: {
                    title: 'TORSO & POSTURA',
                    tagline: 'ESPALDA ESTILIZADA',
                    items: [
                        { n: 'Jalón al Pecho', s: '3 x 15-20', d: 'AGARRE AMPLIO PRONADO. Crucial para crear el efecto de cintura fina al ensanchar sutilmente arriba.', tip: 'Lleva la barra a la parte alta del pecho.', rest: '60s' },
                        { n: 'Remo en Máquina', s: '3 x 15-20', d: 'AGARRE NEUTRO. Mejora la postura después de las horas de clase. Junta las escápulas atrás.', tip: 'Saca pecho y junta las paletas de la espalda al jalar.', rest: '60s' },
                        { n: 'Press de Hombro', s: '3 x 15', d: 'MÁQUINA SENTADA. Más seguro que las mancuernas para tus articulaciones.', tip: 'No estires los brazos del todo arriba para mantener la tensión.', rest: '60s' },
                        { n: 'Vuelos Laterales', s: '3 x 20', d: 'EN POLEA BAJA. La polea mantiene la tensión todo el tiempo.', tip: 'Sube el brazo solo hasta la altura del hombro.', rest: '45s' }
                    ],
                    cardio: { v: '5.0', i: '3', t: '20 min', text: '"Pisa firme y recta. ¡Tú mandas!"' }
                },
                vie: {
                    title: 'QUEMA-AZÚCAR',
                    tagline: 'METABOLISMO AL MÁXIMO',
                    items: [
                        { n: 'Prensa 45°', s: '20 reps', d: 'PIES ALTOS (Variante Glúteo). Ritmo fluido para quemar más.', rest: 'SIGUE' },
                        { n: 'Remo Máquina', s: '20 reps', d: 'Pecho apoyado. Controla el regreso.', rest: 'SIGUE' },
                        { n: 'Press Pecho', s: '20 reps', d: 'Máquina horizontal. Tonificación suave.', rest: '90s' }
                    ],
                    cardio: { v: '5.0', i: '4', t: '20 min' }
                },
                sab: {
                    title: 'DETALLE & CADERA',
                    tagline: 'REAFIRMAR SIN ESTRÉS',
                    items: [
                        { n: 'Abductores', s: '4 x 25', d: 'VARIANTE INCLINADA ADELANTE. Al inclinarte hacia adelante, rellenas los hip dips y marcas la forma de reloj de arena.', tip: 'Abre rápido, aguanta 1 segundo y cierra muy lento.', rest: '45s' },
                        { n: 'Patada de Glúteo', s: '4 x 15-20', d: 'APOYO 90°. Apóyate en un banco o silla estable. Quita peso de la pierna de apoyo para enfocarte 100% en el glúteo.', tip: 'Patea hacia atrás y un poco hacia afuera para máxima activación.', rest: '45s' },
                        { n: 'Prensa Unilateral', s: '3 x 15', d: 'UNA SOLA PIERNA. Excelente para corregir desbalances y obligar a la rodilla a ir derecha.', tip: 'Pie bien arriba. No dejes que la rodilla se meta.', rest: '45s' }
                    ],
                    cardio: { v: '5.3', i: '5', t: '20 min', text: '"Panchita, pisa como si estuvieras en una pasarela. ¡Tú mandas!"' }
                }
            };

            const Header = () => (
                <div className="flex justify-between items-center mb-8 animate-in mt-4">
                    <div>
                        <h1 className="text-4xl font-black italic tracking-tighter text-[#9B1B30]">Hola, Panchita!</h1>
                        <p className="text-[10px] font-bold tracking-[0.2em] text-gray-400 uppercase">Ed. Diferencial UCN 🐾</p>
                    </div>
                    <div className="w-14 h-14 rounded-full flex items-center justify-center border-2 border-[#9B1B30] bg-white soft-shadow text-2xl">☀️</div>
                </div>
            );

            if (day) {
                const data = routines[day];
                return (
                    <div className="min-h-screen p-6 safe-top animate-in pb-32">
                        <button onClick={() => setDay(null)} className="text-[#FF0055] font-black mb-6 flex items-center gap-2">← VOLVER AL HORARIO</button>
                        <h2 className="text-4xl font-black text-[#9B1B30] italic mb-2 text-center leading-none">{data?.title || 'DESCANSO ACTIVO'}</h2>
                        <p className="text-[10px] font-black text-gray-300 tracking-[0.3em] text-center mb-10 uppercase">{data?.tagline}</p>
                        {data ? (
                            <div className="space-y-6">
                                {data.items.map((ex, i) => (
                                    <div key={i} className="bg-white p-7 rounded-card soft-shadow border border-red-50 space-y-4">
                                        <div className="flex justify-between items-start">
                                            <h3 className="font-black text-xl text-[#9B1B30] leading-tight flex-1 mr-4">{ex.n}</h3>
                                            <span className="bg-[#9B1B30] px-4 py-1.5 rounded-xl text-white text-[10px] font-black italic shadow-md">{ex.s}</span>
                                        </div>
                                        <div className="bg-red-50/40 p-4 rounded-2xl text-[11px] font-bold text-gray-600 leading-relaxed border border-red-100/50">
                                            <span className="font-black text-[#9B1B30] uppercase text-[9px] block mb-1 tracking-widest">Nota Técnica:</span>
                                            {ex.d}
                                        </div>
                                        {ex.tip && (
                                            <div className="flex gap-2 text-[10px] italic text-[#FF0055] font-black uppercase">
                                                <span>✨ TIP PRO:</span>
                                                <span>{ex.tip}</span>
                                            </div>
                                        )}
                                        <div className="pt-4 border-t border-gray-50 flex items-center gap-2 text-[9px] font-black text-gray-300 uppercase tracking-widest">
                                            DESCANSO: {ex.rest}
                                        </div>
                                    </div>
                                ))}
                                <div className="bg-[#9B1B30] p-10 rounded-[3rem] text-white shadow-2xl space-y-8">
                                    <h3 className="font-black italic text-center tracking-widest uppercase">Cardio Caminadora</h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-white/10 p-5 rounded-[2rem] text-center border border-white/10">
                                            <p className="text-[9px] opacity-60 mb-1 font-black">KM/H</p>
                                            <p className="text-3xl font-black italic">{data.cardio.v}</p>
                                        </div>
                                        <div className="bg-white/10 p-5 rounded-[2rem] text-center border border-white/10">
                                            <p className="text-[9px] opacity-60 mb-1 font-black">INCLINACIÓN %</p>
                                            <p className="text-3xl font-black italic">{data.cardio.i}</p>
                                        </div>
                                    </div>
                                    {data.cardio.text && (
                                        <div className="bg-white/5 p-5 rounded-3xl border border-white/5 text-[11px] italic text-center font-medium leading-relaxed">
                                            {data.cardio.text}
                                        </div>
                                    )}
                                </div>
                            </div>
                        ) : (
                            <div className="bg-white p-12 rounded-card soft-shadow border border-red-50 text-center">
                                <span className="text-7xl block mb-8">😴</span>
                                <p className="font-bold text-gray-700 italic leading-relaxed text-xl">{schedule.find(s=>s.id===day).text}</p>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-6 safe-top pb-40">
                    {view === 'inicio' ? (
                        <div className="animate-in space-y-6">
                            <Header />
                            <div className="bg-white rounded-card p-6 soft-shadow flex items-center gap-5 border border-red-50">
                                <div className="bg-[#9B1B30] p-4 rounded-2xl text-white text-2xl shadow-lg">🐾</div>
                                <div>
                                    <h3 className="font-black text-[10px] text-[#9B1B30] tracking-widest uppercase">Misión Junior</h3>
                                    <p className="text-[11px] text-gray-500 font-bold leading-tight mt-1">Paseo de 15 min con Junior post-comida. ¡Aliado de tu insulina!</p>
                                </div>
                            </div>
                            <button onClick={() => setView('gym')} className="w-full bg-[#9B1B30] rounded-card py-14 text-white shadow-[0_20px_40px_-10px_rgba(155,27,48,0.4)] flex flex-col items-center gap-4 active:scale-95 transition-transform">
                                <span className="text-6xl">🏋️‍♀️</span>
                                <span className="font-black text-xs uppercase tracking-[0.3em]">Plan de Entrenamiento</span>
                            </button>
                            <div className="bg-white rounded-[2.5rem] p-8 soft-shadow border border-red-50 relative overflow-hidden">
                                <div className="absolute left-0 top-0 bottom-0 w-2 bg-[#9B1B30]"></div>
                                <h3 className="font-black text-[10px] text-[#9B1B30] uppercase tracking-widest mb-3 flex items-center gap-2">🛡️ Protocolo Seguridad</h3>
                                <p className="text-[11px] italic font-bold text-gray-500 leading-relaxed">"Panchita, recuerda que tus pies tienden a meterse. En cada variante, tu misión es que la rodilla apunte afuera. ¡Técnica sobre peso siempre!"</p>
                            </div>
                        </div>
                    ) : (
                        <div className="animate-in">
                            <Header />
                            <h2 className="text-2xl font-black italic text-[#9B1B30] mb-8">Horario UCN Coquimbo</h2>
                            <div className="space-y-4">
                                {schedule.map(d => (
                                    <button key={d.id} onClick={() => setDay(d.id)} className="w-full bg-white rounded-[2.2rem] p-5 flex items-center justify-between soft-shadow border border-red-50 active:scale-95 transition-transform">
                                        <div className="bg-red-50/50 p-4 rounded-2xl text-3xl shadow-inner min-w-[72px] flex items-center justify-center">{d.i}</div>
                                        <div className="text-left flex-1">
                                            <p className="text-[9px] font-black text-[#FF0055] uppercase tracking-widest">{d.n}</p>
                                            <h3 className="font-black text-lg text-[#9B1B30] leading-none mt-1">{d.t}</h3>
                                            {d.s && <p className="text-[8px] font-bold text-white bg-[#9B1B30] px-3 py-0.5 rounded-full inline-block mt-2 tracking-widest uppercase">{d.s}</p>}
                                        </div>
                                        <span className="text-red-100 font-black">→</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}
                    <div className="fixed bottom-10 left-1/2 -translate-x-1/2 w-[90%] bg-white/95 backdrop-blur-md rounded-full shadow-[0_20px_50px_rgba(155,27,48,0.2)] flex justify-around p-3 z-50 border border-red-50">
                        <button onClick={() => { setView('inicio'); setDay(null); }} className={`p-5 rounded-full transition-all ${view==='inicio'&&!day ? 'bg-[#9B1B30] text-white shadow-lg scale-110' : 'text-gray-300'}`}>🏠</button>
                        <button onClick={() => { setView('gym'); setDay(null); }} className={`p-5 rounded-full transition-all ${view==='gym'||day ? 'bg-[#9B1B30] text-white shadow-lg scale-110' : 'text-gray-300'}`}>📅</button>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
